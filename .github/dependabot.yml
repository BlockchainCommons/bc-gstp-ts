version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    reviewers: ["leonardocustodio"]
    schedule:
      interval: "weekly"
    labels: [ "dependencies" ]
    allow:
      - dependency-type: "production"
    groups:
      node:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    reviewers: ["leonardocustodio"]
    schedule:
      interval: "weekly"
    labels: [ "gh-actions" ]
    groups:
      gh-actions:
        patterns:
          - "*"
